server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 660s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
    }
    location / { try_files $uri $uri/ /index.html; }
}
