services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/uploads
      JOB_EXECUTION_MODE: worker
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/uploads
      JOB_EXECUTION_MODE: worker
    volumes:
      - uploads:/data/uploads
    command: [python, -m, app.worker]
    depends_on:
      backend:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
